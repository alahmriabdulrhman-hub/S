name: fetch-unlock-prices
on:
  push:
    branches: [crypto-data]
    paths: [fetch7.py, .github/workflows/fetch7.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { ref: crypto-data }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python fetch7.py | tee fetch7.log
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add ulp unlock_map.json fetch7.log
          git commit -m "أسعار عملات فك القفل" || echo "no changes"
          git pull --rebase origin crypto-data || true
          git push origin crypto-data
