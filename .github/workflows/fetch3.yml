name: fetch-announcements
on:
  push:
    branches: [crypto-data]
    paths: [fetch3.py, .github/workflows/fetch2.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { ref: crypto-data }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python fetch3.py | tee fetch3.log
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add ann fetch3.log
          git commit -m "إعلانات باينانس وأبيت" || echo "no changes"
          git pull --rebase origin crypto-data || true
          git push origin crypto-data
