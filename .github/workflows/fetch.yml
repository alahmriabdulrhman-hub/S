name: fetch-hourly
on:
  push:
    branches: [crypto-data]
    paths: [fetch.py, .github/workflows/fetch.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: crypto-data }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python fetch.py | tee fetch.log
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data fetch.log
          git commit -m "بيانات الساعة لعقود باينانس 2024–2026" || echo "no changes"
          git push origin crypto-data
